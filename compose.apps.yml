# The portfolio apps themselves, as Control Panel-managed containers.
# Layered on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f compose.apps.yml up -d --build
#
# (or put COMPOSE_FILE=docker-compose.yml;compose.apps.yml in .env; use ":"
# instead of ";" on Linux/macOS). The apps live in their own repos, so
# their paths come from .env.
#
# ReBiomed and LabFlow are still being developed in their own repos, so
# their Dockerfiles live here under deploy/ and build from the repos'
# working folders (REBIOMED_DIR, LABFLOW_DIR). Each app's web container is
# published on 127.0.0.1 only; APIs and databases aren't published at all.
#
# Not here on purpose: wUtility Web's API. It compares and syncs SQL Server
# databases using the connection strings the user types, which on this
# machine use Windows authentication; a Linux container can't do that, so
# it stays a host process and wutility-adapter reaches it on the host.
services:
  ledgerdashboard:
    build: ${LEDGERDASH_DIR:?set LEDGERDASH_DIR in .env (the LedgerDashboard repo folder)}
    # The app's own server/.env supplies STORE, DB_PASSWORD (ledger_svc)
    # and ANTHROPIC_API_KEY, so no secret is copied into this repo's .env.
    env_file:
      - path: ${LEDGERDASH_DIR}/server/.env
        required: true
    environment:
      DB_SERVER: host.docker.internal
      # Required on 0.0.0.0: the server refuses to start without a login.
      DASHBOARD_PASSWORD: ${LEDGERDASH_PASSWORD:?set LEDGERDASH_PASSWORD in .env (12+ chars)}
      SESSION_SECRET: ${LEDGERDASH_SESSION_SECRET:?set LEDGERDASH_SESSION_SECRET in .env (32+ chars)}
      # Plain http on this machine: a Secure cookie would never be sent back.
      COOKIE_SECURE: "false"
    volumes:
      - ${JOBSEARCH_DIR:?set JOBSEARCH_DIR in .env (the JobSearch folder)}:/data/JobSearch
    # 127.0.0.1 only: the login is a single shared password, not meant for the LAN.
    ports:
      - "127.0.0.1:${LEDGERDASH_PORT:-4310}:4310"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/api/session').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: ledgerdashboard
      controlpanel.display: "LedgerDashboard"

  # ---------------------------------------------------------- ReBiomed --
  # Its own MongoDB with its own data (not the dev database the app uses
  # on the host), reachable only from the ReBiomed API.
  rebiomed-mongo:
    image: mongo:7
    volumes:
      - rebiomed-mongo:/data/db
    networks:
      - rebiomed
    restart: unless-stopped
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]

  rebiomed-api:
    build:
      context: ${REBIOMED_DIR:?set REBIOMED_DIR in .env (the ReBiomed repo folder)}
      dockerfile: ${DEPLOY_DIR:?set DEPLOY_DIR in .env (absolute path of this repo's deploy folder)}/rebiomed/api.Dockerfile
    depends_on:
      rebiomed-mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://rebiomed-mongo:27017/rebiomed
      JWT_SECRET: ${REBIOMED_JWT_SECRET:?set REBIOMED_JWT_SECRET in .env (32+ chars)}
      CLIENT_URL: http://localhost:${REBIOMED_PORT:-3100}
      # Stripe test keys, optional: without them checkout and payouts fail
      # and the rest of the marketplace works. The app builds its Stripe
      # client at startup and that throws on an empty key, hence the
      # obviously fake default, which Stripe rejects on first use.
      STRIPE_SECRET_KEY: ${REBIOMED_STRIPE_SECRET_KEY:-sk_test_not_configured}
      STRIPE_WEBHOOK_SECRET: ${REBIOMED_STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${REBIOMED_STRIPE_CONNECT_WEBHOOK_SECRET:-}
    volumes:
      - rebiomed-uploads:/app/uploads
      - rebiomed-private:/app/private-uploads
    networks:
      - default
      - rebiomed
    restart: unless-stopped
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/categories').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: rebiomed-api
      controlpanel.display: "ReBiomed API"

  # One-shot demo data (fictional sellers and listings):
  #   docker compose --profile seed run --rm rebiomed-seed
  rebiomed-seed:
    image: controlpanel-rebiomed-api
    profiles: ["seed"]
    command: ["node", "dist/seed/seedProducts.js"]
    depends_on:
      rebiomed-mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://rebiomed-mongo:27017/rebiomed
      JWT_SECRET: ${REBIOMED_JWT_SECRET}
    networks:
      - rebiomed
    restart: "no"

  rebiomed-web:
    build:
      context: ${REBIOMED_DIR}
      dockerfile: ${DEPLOY_DIR:?set DEPLOY_DIR in .env (absolute path of this repo's deploy folder)}/rebiomed/web.Dockerfile
      additional_contexts:
        deploy: ./deploy/rebiomed
      args:
        REACT_APP_STRIPE_PUBLISHABLE_KEY: ${REBIOMED_STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      - rebiomed-api
    ports:
      - "127.0.0.1:${REBIOMED_PORT:-3100}:80"
    restart: unless-stopped
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: rebiomed-web
      controlpanel.display: "ReBiomed web"

  # ----------------------------------------------------------- LabFlow --
  # Uses the LabFlow database on the host SQL Server through labflow_svc
  # (deploy/labflow/sql-login.sql). Runs as Development because that's
  # where LabFlow's demo sign-in (a role switcher, no password) exists;
  # that's why it's bound to 127.0.0.1 and must stay that way.
  labflow-api:
    build:
      context: ${LABFLOW_DIR:?set LABFLOW_DIR in .env (the LabFlow repo folder)}
      dockerfile: ${DEPLOY_DIR:?set DEPLOY_DIR in .env (absolute path of this repo's deploy folder)}/labflow/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LabFlow: "Server=host.docker.internal,1433;Database=LabFlow;User Id=labflow_svc;Password=${LABFLOW_DB_PASSWORD:?set LABFLOW_DB_PASSWORD in .env};TrustServerCertificate=True"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
      # The aspnet image has no curl or wget; bash can speak HTTP/1.0.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/me HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: labflow-api
      controlpanel.display: "LabFlow API"

  labflow-web:
    build:
      context: ${LABFLOW_DIR}
      dockerfile: ${DEPLOY_DIR:?set DEPLOY_DIR in .env (absolute path of this repo's deploy folder)}/labflow/web.Dockerfile
      additional_contexts:
        deploy: ./deploy/labflow
    depends_on:
      - labflow-api
    ports:
      - "127.0.0.1:${LABFLOW_PORT:-5175}:80"
    restart: unless-stopped
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: labflow-web
      controlpanel.display: "LabFlow web"

  # ---------------------------------------------- Language Lesson Designer --
  # Static Vue build (English collocation lessons); no API, no database.
  lessons-web:
    build:
      context: ${LESSONS_DIR:?set LESSONS_DIR in .env (the LanguageLessonDesigner repo folder)}
      dockerfile: ${DEPLOY_DIR:?set DEPLOY_DIR in .env (absolute path of this repo's deploy folder)}/lessons/web.Dockerfile
    ports:
      - "127.0.0.1:${LESSONS_PORT:-5176}:80"
    restart: unless-stopped
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: lessons-web
      controlpanel.display: "English lessons"

  # Review-progress sync between the owner's phone and PC (english.<domain>/api/sync
  # and ctx.<domain>/api/sync via Caddy). One JSON file and its key in the volume.
  lessons-sync:
    build:
      context: ${LESSONS_DIR:?set LESSONS_DIR in .env (the LanguageLessonDesigner repo folder)}
      dockerfile: ${DEPLOY_DIR:?set DEPLOY_DIR in .env (absolute path of this repo's deploy folder)}/lessons/sync.Dockerfile
    ports:
      - "127.0.0.1:${LESSONS_SYNC_PORT:-5178}:8080"
    volumes:
      - lessons-sync-data:/data
    restart: unless-stopped
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/sync/health"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: lessons-sync
      controlpanel.display: "English lessons sync"

  # ---------------------------------------------------------- ClinicReport --
  # Structured clinical reporting (github.com/ArashKeshtgar/ClinicReport): one
  # .NET image that also serves the React app; SQLite in a volume. Runs as the
  # public demo: synthetic patients, one-click demo users, reset every night.
  clinicreport:
    build:
      context: ${CLINICREPORT_DIR:-../ClinicReport}
    ports:
      - "127.0.0.1:${CLINICREPORT_PORT:-5177}:8080"
    volumes:
      - clinicreport-data:/data
    environment:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Clinic__Name: "ClinicReport Demo Clinic"
      Clinic__Address: "Demo only - not a real clinic"
      Clinic__ReportFooter: "Synthetic demo data. Not for clinical use."
      Demo__Enabled: "true"
      # 08:00 UTC = 3-4 AM in Toronto
      Demo__ResetHourUtc: "8"
    restart: unless-stopped
    labels:
      controlpanel.managed: "true"
      controlpanel.service: clinicreport
      controlpanel.display: "ClinicReport"

  # ---------------------------------------------------------- Analytics --
  # Reporting and forecasts (github.com/ArashKeshtgar/Analytics): one image for
  # the API, the scheduler (`analytics schedule`: extract + build + score every
  # ANALYTICS_RUN_EVERY) and the event consumer, sharing the data volume. The
  # scheduler builds a copy of the warehouse and swaps it in, so the API keeps
  # serving the last good run. Sign-in is ClinicHub on the host (the dashboard
  # is ClinicHub's `analytics` client, redirect http://localhost:5601/...), so
  # the web port stays 5601. No health information: de-identified by design.
  analytics-api:
    build: ${ANALYTICS_DIR:-../Analytics}
    image: controlpanel-analytics
    environment: &analytics-env
      ANALYTICS_HOST: 0.0.0.0
      ANALYTICS_DATA_DIR: /app/data
      ANALYTICS_WAREHOUSE_PATH: /app/data/warehouse.duckdb
      # The issuer as the browser sees it; the keys fetched over the host.
      ANALYTICS_OIDC_ISSUER: ${ANALYTICS_OIDC_ISSUER:-http://localhost:5301/}
      ANALYTICS_OIDC_JWKS_URI: ${ANALYTICS_OIDC_JWKS_URI:-http://host.docker.internal:5300/.well-known/jwks}
      ANALYTICS_WEB_ORIGIN: http://localhost:${ANALYTICS_PORT:-5601}
      # Read-only login on FinancePowerApp (analytics_reader); empty = no extract, runs fail and say so.
      ANALYTICS_FINANCE_CONNECTION_STRING: ${ANALYTICS_FINANCE_CONNECTION_STRING:-}
      # Optional: LabFlow's warehouse (analytics_dw_reader, monthly lab volumes); empty = not read.
      ANALYTICS_LABFLOW_DW_CONNECTION_STRING: ${ANALYTICS_LABFLOW_DW_CONNECTION_STRING:-}
      ANALYTICS_RABBITMQ_URL: ${ANALYTICS_RABBITMQ_URL:-amqp://guest:guest@host.docker.internal:5672/}
      ANALYTICS_RUN_EVERY: ${ANALYTICS_RUN_EVERY:-6h}
      # Told (JSON POST) when a run fails and when it works again; empty = nobody.
      ANALYTICS_ALERT_WEBHOOK_URL: ${ANALYTICS_ALERT_WEBHOOK_URL:-}
      ANALYTICS_KEEP_EXTRACT_DAYS: ${ANALYTICS_KEEP_EXTRACT_DAYS:-14}
      ANALYTICS_KEEP_REPORTS: ${ANALYTICS_KEEP_REPORTS:-200}
    volumes:
      - analytics-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5600/healthz')"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: analytics-api
      controlpanel.display: "Analytics API"

  analytics-scheduler:
    image: controlpanel-analytics
    command: ["analytics", "schedule"]
    depends_on:
      - analytics-api
    environment: *analytics-env
    volumes:
      - analytics-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    labels:
      controlpanel.managed: "true"
      controlpanel.service: analytics-scheduler
      controlpanel.display: "Analytics scheduler"

  # IntegrationHub's de-identified events (RabbitMQ). Optional:
  #   docker compose --profile events up -d analytics-consumer
  analytics-consumer:
    image: controlpanel-analytics
    profiles: ["events"]
    command: ["analytics", "consume"]
    depends_on:
      - analytics-api
    environment: *analytics-env
    volumes:
      - analytics-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    labels:
      controlpanel.managed: "true"
      controlpanel.service: analytics-consumer
      controlpanel.display: "Analytics events"

  analytics-web:
    build:
      context: ${ANALYTICS_DIR:-../Analytics}/web
      args:
        VITE_OIDC_AUTHORITY: ${ANALYTICS_OIDC_ISSUER:-http://localhost:5301/}
    depends_on:
      - analytics-api
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-5601}:80"
    restart: unless-stopped
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: analytics-web
      controlpanel.display: "Analytics web"

  # ------------------------------------------------------- IntegrationHub --
  # The message hub between the clinic applications (github.com/ArashKeshtgar/IntegrationHub): relays
  # results, orders, prescriptions and financial documents between them, logs metadata only (never a
  # body), and sends de-identified events to RabbitMQ for Analytics. Its own PostgreSQL and RabbitMQ
  # run here (RabbitMQ is published on 127.0.0.1:5672, where Analytics' consumer looks for it, so do
  # not run the hub repository's own compose.yml at the same time). The applications it relays to
  # are reached on the host. Sign-in is ClinicHub (client `integrationhub-admin`, redirect
  # http://localhost:5701/...), so the web port stays 5701. HL7 and the event feed are off until
  # their secrets are set in .env (see the hub's README).
  integrationhub-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integrationhub
      POSTGRES_USER: integrationhub
      POSTGRES_PASSWORD: ${INTEGRATIONHUB_DB_PASSWORD:-integrationhub}
    volumes:
      - integrationhub-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 6
      test: ["CMD-SHELL", "pg_isready -U integrationhub"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: integrationhub-db
      controlpanel.display: "IntegrationHub database"

  integrationhub-mq:
    image: rabbitmq:3.13-alpine
    ports:
      - "127.0.0.1:5672:5672"
    volumes:
      - integrationhub-mq:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 6
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: integrationhub-mq
      controlpanel.display: "IntegrationHub RabbitMQ"

  integrationhub:
    build: ${INTEGRATIONHUB_DIR:-../IntegrationHub}
    image: controlpanel-integrationhub
    depends_on:
      integrationhub-db:
        condition: service_healthy
      integrationhub-mq:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INTEGRATIONHUB_API_PORT:-5700}:5700"
    environment:
      HUB_DB_URL: jdbc:postgresql://integrationhub-db:5432/integrationhub
      HUB_DB_PASSWORD: ${INTEGRATIONHUB_DB_PASSWORD:-integrationhub}
      HUB_RABBITMQ_HOST: integrationhub-mq
      # RabbitMQ refuses `guest` from another container: the hub's own account (see the hub's README).
      HUB_RABBITMQ_USER: ${INTEGRATIONHUB_RABBITMQ_USER:-guest}
      HUB_RABBITMQ_PASSWORD: ${INTEGRATIONHUB_RABBITMQ_PASSWORD:-guest}
      # Development: FinancePowerApp takes PharmaFlow's X-Finance-Key instead of a token; empty = tokens only.
      HUB_ROUTE_FINANCE_API_KEY_HEADER: ${INTEGRATIONHUB_FINANCE_API_KEY_HEADER:-X-Finance-Key}
      # The issuer as the browser sees it; the keys fetched over the host.
      HUB_AUTH_ISSUER: ${INTEGRATIONHUB_AUTH_ISSUER:-http://localhost:5301/}
      HUB_AUTH_JWKS_URI: ${INTEGRATIONHUB_AUTH_JWKS_URI:-http://host.docker.internal:5300/.well-known/jwks}
      HUB_ROUTE_CLINICHUB_UPSTREAM: ${INTEGRATIONHUB_CLINICHUB_URL:-http://host.docker.internal:5300}
      HUB_ROUTE_LABFLOW_UPSTREAM: ${INTEGRATIONHUB_LABFLOW_URL:-http://host.docker.internal:5180}
      HUB_ROUTE_CLINICREPORT_UPSTREAM: ${INTEGRATIONHUB_CLINICREPORT_URL:-http://host.docker.internal:5290}
      HUB_ROUTE_PHARMAFLOW_UPSTREAM: ${INTEGRATIONHUB_PHARMAFLOW_URL:-http://host.docker.internal:5500}
      HUB_ROUTE_FINANCE_UPSTREAM: ${INTEGRATIONHUB_FINANCE_URL:-http://host.docker.internal:5400}
      # The admin web calls through its own nginx; CORS only matters for `npm run dev` on another port.
      HUB_ADMIN_CORS_ORIGINS: http://localhost:${INTEGRATIONHUB_PORT:-5701}
      # Empty = off. Events need 32+ characters; HL7 needs the queue key and ClinicHub's secret for `integrationhub`.
      HUB_EVENTS_ENABLED: ${INTEGRATIONHUB_EVENTS_ENABLED:-false}
      HUB_EVENTS_PSEUDONYM_SECRET: ${INTEGRATIONHUB_EVENTS_PSEUDONYM_SECRET:-}
      HUB_HL7_ENABLED: ${INTEGRATIONHUB_HL7_ENABLED:-false}
      HUB_HL7_QUEUE_KEY: ${INTEGRATIONHUB_HL7_QUEUE_KEY:-}
      HUB_CLINICHUB_CLIENT_SECRET: ${INTEGRATIONHUB_CLINICHUB_CLIENT_SECRET:-}
      HUB_ALERTS_WEBHOOK_URL: ${INTEGRATIONHUB_ALERTS_WEBHOOK_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5700/actuator/health/liveness"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: integrationhub
      controlpanel.display: "IntegrationHub"

  integrationhub-web:
    build:
      context: ${INTEGRATIONHUB_DIR:-../IntegrationHub}/web
      args:
        VITE_OIDC_AUTHORITY: ${INTEGRATIONHUB_AUTH_ISSUER:-http://localhost:5301/}
    depends_on:
      - integrationhub
    ports:
      - "127.0.0.1:${INTEGRATIONHUB_PORT:-5701}:80"
    restart: unless-stopped
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: integrationhub-web
      controlpanel.display: "IntegrationHub web"

networks:
  # internal: MongoDB has no route out and only the ReBiomed API can reach it.
  rebiomed:
    internal: true

volumes:
  rebiomed-mongo:
  rebiomed-uploads:
  rebiomed-private:
  clinicreport-data:
  lessons-sync-data:
  analytics-data:
  integrationhub-db:
  integrationhub-mq:
