server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Verification documents and listing photos are uploaded through the API.
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://rebiomed-api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /uploads/ {
    proxy_pass http://rebiomed-api:5000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
