# A single-page app: files as they are, every other path is the app (its router decides). No proxying here:
# Caddy routes the API's paths before they reach this container.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed bundles never change; the page itself is always fetched again.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
