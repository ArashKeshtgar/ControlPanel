server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The built app calls core-api as /api/... on its own origin, so the
  # browser needs no CORS and nothing hardcodes a host or port.
  location /api/ {
    proxy_pass http://core-api:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
