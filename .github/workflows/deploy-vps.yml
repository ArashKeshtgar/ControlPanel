name: Deploy to VPS

# After CI passes on main, or by hand (Actions -> Deploy to VPS -> Run
# workflow) after pushing LedgerDashboard, ReBiomed or LabFlow, whose pushes
# don't trigger anything here. Off until the repository variable
# VPS_DEPLOY_ENABLED is "true". Setup: deploy/vps/README.md, step 7.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    if: >-
      vars.VPS_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run deploy.sh on the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: never trust whatever answers on first connect.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is restricted on the server to running deploy.sh only
          # (command= in authorized_keys), so no command is sent here.
          ssh -T -o BatchMode=yes "deploy@$VPS_HOST"
