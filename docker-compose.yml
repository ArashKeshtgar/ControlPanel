# Full stack in one command, from a fresh clone:
#
#   cp .env.example .env    # then fill in every value
#   docker compose up --build
#
# SQL Server runs in its own container with its own databases, initialized
# from db/*.sql by the one-shot db-init service and seeded with users by
# seed-users. The registry is seeded with container hostnames, so there's
# no manual UPDATE step. The only piece outside this file is wUtility Web's
# .NET API (a separate repo): wutility-adapter reaches it on the host via
# host.docker.internal and reports "unreachable" until it's running.
#
# Service control (the Services page): long-running services restart on
# their own (restart: unless-stopped) and report health. Containers labelled
# controlpanel.managed=true can be started, stopped and restarted from
# Control Panel by an Admin. core-api reaches Docker only through
# socket-proxy, on a network nothing else joins, and the proxy forwards
# nothing but list, logs, start and stop. core-api, the frontend, SQL Server
# and the proxy itself carry no label, so the panel can't switch itself off.
x-node-health: &node-health
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in .env}
    # Published on 14333 so it doesn't collide with a local SQL Server on 1433.
    ports:
      - "14333:1433"
    restart: unless-stopped
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/db/init.sh"]
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      WUTILITY_ADAPTER: wutility-adapter:4001
      HISPLUS_ADAPTER: hisplus-adapter:4002
      LEDGERDASH_ADAPTER: ledgerdash-adapter:4006
    volumes:
      - ./db:/db:ro
    restart: "no"

  seed-users:
    build: ./services/core-api
    command: ["node", "dist/scripts/seed-users.js"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_SERVER: sqlserver
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:?set VIEWER_PASSWORD in .env}
    restart: "no"

  # Least-privilege Docker API: GET /containers (list, logs) plus POST
  # start and stop. ALLOW_RESTARTS stays off because it also permits kill;
  # core-api restarts as stop + start. Everything else (create, exec,
  # delete, images, volumes, networks, info...) answers 403.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.5-r0-ls99
    environment:
      CONTAINERS: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_LOGS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    networks:
      - docker-control
    restart: unless-stopped

  core-api:
    build: ./services/core-api
    ports:
      - "4000:4000"
    networks:
      - default
      - docker-control
    restart: unless-stopped
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    depends_on:
      seed-users:
        condition: service_completed_successfully
    environment:
      DB_SERVER: sqlserver
      DB_NAME: ControlPanelDb
      DB_USER: controlpanel_svc
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      # Optional: enables the assistant (POST /assistant/ask); without it that endpoint answers 503.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # localhost: the not-yet-built adapters are seeded as localhost:40xx and
      # simply show "unreachable" until they exist.
      ADAPTER_ALLOWED_HOSTS: localhost,wutility-adapter,hisplus-adapter,ledgerdash-adapter
      DOCKER_PROXY_URL: http://socket-proxy:2375
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-4100}

  wutility-adapter:
    build: ./services/adapters/wutility-adapter
    ports:
      - "4001:4001"
    restart: unless-stopped
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: wutility-adapter
      controlpanel.display: "wUtility adapter"
    environment:
      WUTILITY_API_BASE: ${WUTILITY_API_BASE:-http://host.docker.internal:5091}
      WUTILITY_API_KEY: ${WUTILITY_API_KEY:?set WUTILITY_API_KEY in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Reads LedgerDashboard's SQL Server database on the host (not the
  # container SQL Server above) through its read-only reporting views.
  ledgerdash-adapter:
    build: ./services/adapters/ledgerdash-adapter
    ports:
      - "4006:4006"
    restart: unless-stopped
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4006/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: ledgerdash-adapter
      controlpanel.display: "LedgerDashboard adapter"
    environment:
      DB_SERVER: host.docker.internal
      DB_NAME: LedgerDashboard
      DB_USER: ledger_reader
      DB_PASSWORD: ${LEDGER_READER_PASSWORD:?set LEDGER_READER_PASSWORD in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hisplus-adapter:
    build: ./services/adapters/hisplus-adapter
    ports:
      - "4002:4002"
    restart: unless-stopped
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    labels:
      controlpanel.managed: "true"
      controlpanel.service: hisplus-adapter
      controlpanel.display: "HIS+ adapter"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_SERVER: sqlserver
      DB_NAME: HisPlusDemo
      DB_USER: controlpanel_svc
      DB_PASSWORD: ${DB_PASSWORD}

  frontend:
    build: ./frontend
    # FRONTEND_PORT in .env if 4100 is taken (e.g. by ng serve).
    ports:
      - "${FRONTEND_PORT:-4100}:80"
    restart: unless-stopped
    healthcheck:
      <<: *node-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    depends_on:
      - core-api

networks:
  # internal: no route out, and only core-api and the proxy are on it.
  docker-control:
    internal: true

volumes:
  sqldata:
